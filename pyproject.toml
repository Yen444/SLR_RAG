[project]
name = "slr-rag"
version = "0.1.0"
description = "Local tool for reviewing a paper collection: PDF viewer, configurable extraction, per-paper chat and similar-paper search."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-chroma>=0.2",
    "langchain-text-splitters>=0.3",
    "pymupdf>=1.24",
    "streamlit>=1.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "langchain>=1.4.6",
    "langchain-google-genai>=4.4.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slr_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
