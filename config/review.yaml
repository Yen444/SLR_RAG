# Review configuration: edit freely, changes show up when the app reruns.

# Work status of a paper. The first one is the default for new papers.
statuses: [todo, in_progress, done]
done_status: done             # counted in the progress bar

# Include/exclude decision. The first one is the default (papers from the screening CSVs are already included).
decisions: [include, exclude, maybe]
exclude_decision: exclude     # choosing this asks for an exclusion reason
exclusion_reasons:
  - not about synthetic event log generation / simulation / augmentation
  - no new method (only applies an existing tool)
  - not enough methodological detail
  - duplicate / extended version of another included paper
  - other

# Context for "Fill with AI" (added to its instructions).
ai_instructions: |
  This systematic literature review is about approaches that generate, simulate or augment
  synthetic event logs for process mining.
  - Only report what the paper states. Prefer null over a guess.
  - Leave every "Notes" field (A5, B8, C4, D3, E6, G1) empty: they are for the human coder.
  - Distinguish what the authors contribute from functionality inherited from existing tools.
  - B5: list a perspective only if the generation mechanism explicitly models, controls or reproduces it,
    not just because an attribute appears in the output.
  - D1: select only attributes present in the generated output, not attributes of the input or model.
  - F2: write limitations you notice yourself, and mark them as interpretation ("Possibly ...").
  - Multi-select fields: choose every option that applies. Pick "Other (specify)" only when no option
    fits, and then write the value in the `specify` text.

# Extraction form, grouped in sections. Every field may stay empty.
#   name:        identifier used as the JSON key and CSV column (letters, digits, _)
#   label:       shown in the UI
#   type:        text | longtext | number | bool | select | multiselect
#   options:     required for select / multiselect
#   description: help text, also the instruction for "Fill with AI"
#   placeholder: example text in an empty text box
#   height:      longtext only: box height in pixels (default 80; every box can also be resized by dragging)
#   specify:     adds a free-text box next to the field (saved as <name>_specify), e.g. for "Other (specify)"
sections:
  - title: A. General information
    fields:
      - name: A1_application_domain
        label: A1. Application domain
        type: select
        options: [General-purpose, Domain-specific]
        specify: Domain (if domain-specific)
        description: Is the approach general-purpose or built for a specific domain? If domain-specific, name the domain.

      - name: A2_main_goal
        label: A2. Main goal
        type: longtext
        height: 68
        description: What is the primary objective of the proposed approach?
        placeholder: e.g. Generate realistic event logs with resource behaviour to benchmark discovery algorithms

      - name: A3_target_application
        label: A3. Target application
        type: multiselect
        options:
          - Process mining benchmarking
          - Process discovery
          - Conformance checking
          - Predictive process monitoring
          - Data augmentation
          - What-if analysis
          - Process optimization
          - Decision support
          - Process model validation
          - Privacy-preserving data sharing
          - Other (specify)
        specify: Other (specify)
        description: What are the generated logs intended to be used for?

      - name: A4_approach_maturity
        label: A4. Approach maturity
        type: select
        options:
          - Conceptual approach (not implemented)
          - Prototype / proof of concept
          - Implemented research tool
          - Publicly available tool
          - Other (specify)
        specify: Other (specify) / link to the tool
        description: How mature is the implementation? "Publicly available" needs a stated link or repository; give it in the specify box.

      - name: A5_notes
        label: A5. Notes
        type: longtext
        height: 68
        description: Additional notes about the paper's general characteristics, purpose, domain, or application.

  - title: B. Generation / simulation / augmentation methodology
    fields:
      - name: B1_required_input
        label: B1. Required input
        type: longtext
        height: 68
        description: What inputs are necessary to run the approach?
        placeholder: e.g. BPMN model with simulation parameters; an existing event log

      - name: B2_generated_output
        label: B2. Generated output
        type: longtext
        height: 68
        description: What does the approach produce?
        placeholder: e.g. Event log with start/end timestamps and resources; also a simulation model

      - name: B3_core_mechanism
        label: B3. Core mechanism
        type: longtext
        height: 320
        description: >-
          Explain in detail how the approach generates, simulates, or augments synthetic event logs,
          including the main processing steps and relevant execution mechanisms.
        placeholder: "Step by step: 1) … 2) … 3) …  Execution mechanism (e.g. discrete-event simulation, token game, generative model, LLM)…"

      - name: B4_methodological_novelty
        label: B4. Main methodological novelty
        type: longtext
        description: What specific methodological contribution does the paper introduce compared with existing approaches?

      - name: B5_process_perspectives
        label: B5. Modeled process perspectives
        type: longtext
        description: >-
          Which aspects of process behaviour are explicitly modelled, controlled, or reproduced by the generation
          mechanism (e.g. control flow, time, resources, data, inter-case interactions)? Do not infer behavioural
          modelling solely from the presence of an attribute in the generated output.
        placeholder: e.g. Control flow (BPMN), time (duration distributions), resources (calendars, allocation)

      - name: B6_additional_capabilities
        label: B6. Additional generation capabilities
        type: longtext
        description: >-
          Additional capabilities, such as noise injection, trace variability control, constraint satisfaction,
          negative trace generation, or conditional generation.

      - name: B7_external_tools
        label: B7. External tools and dependencies
        type: longtext
        description: >-
          Which existing simulators, libraries, solvers, models, or platforms are used? Distinguish the authors'
          contributions from inherited functionality.
        placeholder: "e.g. Built on BIMP (inherited: simulation engine); new: calendar discovery"

      - name: B8_notes
        label: B8. Notes
        type: longtext
        height: 68
        description: Additional methodological details or observations.

  - title: C. Configurability
    fields:
      - name: C1_configurable_aspects
        label: C1. Configurable aspects
        type: multiselect
        options:
          - Process model / control flow
          - Number of cases / log size
          - Trace length
          - Arrival patterns
          - Activity durations
          - Resource availability / allocation
          - Data attributes
          - Routing probabilities
          - Noise level
          - Random seed
          - Other (specify)
        specify: Other (specify)
        description: Which aspects can users explicitly configure?

      - name: C2_configuration_mechanism
        label: C2. Configuration mechanism
        type: multiselect
        options:
          - Graphical user interface
          - Configuration file
          - API / programming interface
          - Model annotations
          - Prompts / natural language
          - Other (specify)
        specify: Other (specify)
        description: How does the user configure the generation?

      - name: C3_configuration_limitations
        label: C3. Configuration limitations
        type: longtext
        description: What aspects are fixed, restricted, or difficult to configure?

      - name: C4_notes
        label: C4. Notes
        type: longtext
        height: 68
        description: Additional information about configurability.

  - title: D. Generated synthetic event log
    fields:
      - name: D1_log_attributes
        label: D1. Generated event-log attributes
        type: multiselect
        options:
          - Case ID
          - Activity name
          - Single timestamp
          - Start timestamp
          - End timestamp
          - Resource / performer
          - Lifecycle transition
          - Case-level data attributes
          - Event-level data attributes
          - Other (specify)
        specify: Other (specify)
        description: >-
          Attributes present in the generated output (not merely in the input or the simulation model).
          Start and end timestamps may both be selected.

      - name: D2_output_format
        label: D2. Output format
        type: multiselect
        options: [XES, CSV, JSON, Database, Tool-specific format, Other (specify)]
        specify: Other (specify) / tool-specific format
        description: In which format(s) is the generated log written?

      - name: D3_notes
        label: D3. Notes
        type: longtext
        height: 68
        description: Additional information about generated event logs, output structure, or format.

  - title: E. Evaluation
    fields:
      - name: E1_evaluation_strategy
        label: E1. Evaluation strategy
        type: multiselect
        options:
          - Case study
          - Controlled experiment
          - Benchmark evaluation
          - Comparison with real event logs
          - Comparison with other approaches
          - Qualitative / expert evaluation
          - No evaluation
          - Other (specify)
        specify: Other (specify)
        description: How is the approach evaluated? Choose "No evaluation" only on its own.

      - name: E2_evaluation_objectives
        label: E2. Evaluation objectives
        type: multiselect
        options:
          - Realism / similarity
          - Utility for downstream tasks
          - Behavioral correctness / conformance
          - Scalability / performance
          - Flexibility / configurability
          - Other (specify)
        specify: Other (specify)
        description: What does the evaluation try to show?

      - name: E3_evaluation_metrics
        label: E3. Evaluation metrics
        type: longtext
        description: List the metrics used to evaluate the generated data or approach.
        placeholder: e.g. Control-flow similarity, activity-duration distance, resource-distribution similarity, predictive accuracy, generation time

      - name: E4_evaluation_datasets
        label: E4. Evaluation datasets
        type: longtext
        description: Specify the datasets, process models, or case studies used for evaluation.
        placeholder: e.g. BPI Challenge event logs, synthetic benchmarks, healthcare workflows

      - name: E5_evaluation_results
        label: E5. Evaluation results
        type: longtext
        height: 120
        description: Summarize the main evaluation findings, including relevant quantitative results where available.

      - name: E6_notes
        label: E6. Notes
        type: longtext
        height: 68
        description: Additional information about the evaluation design, baselines, results, or validity.

  - title: F. Limitations
    fields:
      - name: F1_author_limitations
        label: F1. Author-reported limitations
        type: longtext
        description: Limitations explicitly acknowledged by the authors.

      - name: F2_reviewer_limitations
        label: F2. Reviewer-identified limitations
        type: longtext
        description: >-
          Limitations identified during coding but not explicitly discussed by the authors.
          Distinguish interpretation from reported evidence.

  - title: G. Additional notes
    fields:
      - name: G1_general_notes
        label: G1. General notes
        type: longtext
        description: Additional observations, ambiguities, implementation details, or information not covered by the predefined fields.

      - name: G2_evidence_references
        label: G2. Evidence and references
        type: longtext
        description: Supporting page numbers, sections, figures, tables, or relevant quotations for key coding decisions.
        placeholder: e.g. B3 → Sec. 4.2, Fig. 3 (p. 7); D1 → Table 2 (p. 9)
